# Shared crawler policy for LMFDB virtual hosts, including production.
# Requires Apache 2.4.8+ and RewriteEngine On inside each affected VirtualHost.
# Match the requested LMFDB hostname, including the existing .com aliases.
# The boundary and end anchors exclude otherlmfdb.org and lmfdb.org.example.
RewriteEngine On
RewriteOptions InheritDownBefore

# Self-identifying crawlers. This is not a detector for browser-looking bots.
# Exclude Google's uptime monitor and documented crawler tokens from this ban.
# This exception does not bypass the existing gate or other access controls.
# Keep robots.txt accessible; this block does not change any robots.txt policy.
RewriteCond %{HTTP_HOST} (^|\.)lmfdb\.(org|xyz|com)\.?(:[0-9]+)?$ [NC]
RewriteCond %{REQUEST_URI} !^/robots\.txt$
RewriteCond %{HTTP_USER_AGENT} !(GoogleStackdriverMonitoring-UptimeChecks|Googlebot|GoogleOther|Google-InspectionTool|Storebot-Google|AdsBot-Google|Mediapartners-Google|Google-CloudVertexBot) [NC]
RewriteCond %{HTTP_USER_AGENT} (bot|spider|crawl|slurp|bingpreview|facebookexternalhit|meta-external(agent|fetcher)) [NC]
RewriteRule ^ - [F,L]

# Temporary network AND user-agent matches from the 2026-09-26 access log.
# Retained from the previous configuration, now limited to LMFDB sites.
# These are traffic fingerprints, not verified crawler ownership.
# Review/remove when the crawl has subsided. Keep robots.txt accessible.
RewriteCond %{HTTP_HOST} (^|\.)lmfdb\.(org|xyz|com)\.?(:[0-9]+)?$ [NC]
RewriteCond %{REQUEST_URI} !^/robots\.txt$
RewriteCond %{REMOTE_ADDR} ^116\.179\.33\.
RewriteCond %{HTTP_USER_AGENT} Chrome/99\.0\.4844\.51([[:space:]]|$) [NC]
RewriteRule ^ - [F,L]

RewriteCond %{HTTP_HOST} (^|\.)lmfdb\.(org|xyz|com)\.?(:[0-9]+)?$ [NC]
RewriteCond %{REQUEST_URI} !^/robots\.txt$
RewriteCond %{REMOTE_ADDR} ^(111\.225\.214|119\.249\.100)\.
RewriteCond %{HTTP_USER_AGENT} Chrome/48\.0\.2564\.116([[:space:]]|$) [NC]
RewriteRule ^ - [F,L]

# Retained from the previous configuration.
ErrorDocument 403 "Forbidden."

# mod_qos response status: server context only, never inside VirtualHost.
# This sets the status for applicable mod_qos denials across the server;
# it does NOT enable limits on other sites. Limits below are beta/alpha only.
QS_ErrorResponseCode 429

# Diagnostic format only; used by beta and alpha below. No limits are changed.
# D in qos means denied, L means delayed; upstream is the backend response status.
# A missing upstream status alone does NOT prove the backend was never contacted.
LogFormat "vhost=%v status=%>s upstream=%{proxy-status}n qos=%{mod_qos_ev}e qos_cr=%{mod_qos_cr}e qos_error=%{QS_ErrorNotes}e us=%D end=%{end:sec}t ip=%a \"%r\"" lmfdb_qos_metrics

<VirtualHost *:80>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/server-status(?:\?.*)?
    RewriteRule (.+) https://%{SERVER_NAME}$1 [R=301,L]
</VirtualHost>


# Global stuff
#Dealing with proxy servers
Header append Vary User-Agent


Alias /gate.html /var/www/gate/gate.html
ProxyPass /gate.html !
<Directory "/var/www/gate">
    Require all granted
</Directory>

# Allow access from all domains for webfonts.
# Alternatively you could only whitelist your
# subdomains like "subdomain.example.com".
<IfModule mod_headers.c>
    <FilesMatch "\.(ttf|ttc|otf|eot|woff|woff2|font.css|css)$">
        Header set Access-Control-Allow-Origin "*"
    </FilesMatch>
</IfModule>

SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png)$ no-gzip dont-vary
SetEnvIfNoCase Request_URI \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary


## EXPIRES CACHING ##
ExpiresActive On
ExpiresByType image/jpg "access 1 hour"
ExpiresByType image/jpeg "access 1 hour"
ExpiresByType image/gif "access 1 hour"
ExpiresByType image/png "access 1 hour"
ExpiresByType text/css "access 1 hour"
ExpiresByType text/html "access 0 minutes"
ExpiresByType application/pdf "access 10 minutes"
ExpiresByType text/x-javascript "access 10 minutes"
ExpiresByType image/x-icon "access 1 day"
ExpiresDefault "access 10 minutes"

<FilesMatch "\.(ico|jpeg|pdf|flv|jpg|png|gif|svg|js|css|swf)$">
    Header set Cache-Control "max-age=600, public"
    Header unset Last-Modified
    Header unset ETag
    FileETag None
</FilesMatch>
<FilesMatch "\.(html|php)$">
    #Header set Cache-Control "max-age=600, public, must-revalidate"
    Header set Cache-Control "no-cache, no-store, must-revalidate"
    Header set Pragma "no-cache"
    Header set Expires 0
</FilesMatch>
ProxyPass /flasklog !
ProxyPass /static !
ProxyPass /MathJax !
ProxyPass /icons !
RequestHeader set X-Forwarded-Proto "https"

<VirtualHost *:443>
    ServerName beta.lmfdb.org
    ServerAlias dev.lmfdb.xyz
    ServerAlias beta.lmfdb.xyz
    ServerAlias beta.lmfdb.com

    # Beta-only aggregate application budget. REQUIRES mod_qos.
    # One shared budget across this vhost and its aliases, not per client/IP.
    # Starting values, not measured capacity: 8 concurrent requests and a
    # target of 10 requests/second. The latter uses sampled rate + delays,
    # not a strict per-second cutoff. Keep the two patterns IDENTICAL.
    # Exact health paths and the listed assets/local aliases are excluded.
    # No user-agent exemption: Google's health checks remain outside the
    # budget by path, while ordinary content requests share the budget.
    # Do not wrap this in IfModule: an unloaded module must fail configtest,
    # rather than silently disable the protection.
    QS_LocRequestLimitMatch "^/(?!(?:alive|statshealth|server-status|robots\.txt|gate\.html|favicon\.ico|style\.css)(?:[?]|$)|(?:static|MathJax|icons|flasklog|supervisorlog|data|riemann-zeta-zeros)(?:/|[?]|$))" 4
    QS_LocRequestPerSecLimitMatch "^/(?!(?:alive|statshealth|server-status|robots\.txt|gate\.html|favicon\.ico|style\.css)(?:[?]|$)|(?:static|MathJax|icons|flasklog|supervisorlog|data|riemann-zeta-zeros)(?:/|[?]|$))" 4
    ErrorDocument 429 "LMFDB is busy. Please retry in 30 seconds."
    Header always set Retry-After "30" "expr=%{REQUEST_STATUS} == 429"
    Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} == 429"

    # <IfModule mod_rewrite.c>
    #     # TEMP BLOCK: Throttle domains with 'lmfdb' in the Host header
    #     RewriteEngine On
    #     RewriteCond %{HTTP_HOST} lmfdb [NC]
    #     # for requests to API or download paths.
    #     # RewriteCond %{REQUEST_URI} (api|download)
    #     RewriteRule ^ - [R=429,L]
    # </IfModule>

    # this covers *.lmfdb.xyz {www, beta, ''}.lmfdb.{org, com}
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf

    Alias /static /home/lmfdb/lmfdb-git-dev/lmfdb/static
    <Directory "/home/lmfdb/lmfdb-git-dev/lmfdb/static">
        Require all granted
    </Directory>

    Alias /flasklog /home/lmfdb/lmfdb-git-dev/flasklog
    <Directory "/home/lmfdb/lmfdb-git-dev">
        Require all granted
    </Directory>

    Alias /supervisorlog /home/lmfdb/logs/dev/supervisor.log
    <Directory "/home/lmfdb/logs/dev/">
        Require all granted
    </Directory>
    ProxyPass /supervisorlog !

    Alias /data /scratch/lmfdb-buckets/
    <Directory "/scratch/lmfdb-buckets/">
        Options +Indexes
        Require all granted
    </Directory>
    ProxyPass /data !

    Alias /riemann-zeta-zeros /home/lmfdb/data/zeros/zeta/
    <Directory "/home/lmfdb/data/zeros/zeta/">
        Options +Indexes
        Require all granted
    </Directory>
    ProxyPass /riemann-zeta-zeros !

    Alias /server-status /var/www/dummy
    <Directory "/var/www/">
        Require local
    </Directory>
    ProxyPass /server-status !
    # LMFDB-only crawl policy; do not move this to global/server scope.
    # This exclusion must precede the catch-all ProxyPass below.
    ProxyPass /robots.txt !
    Alias /robots.txt /var/www/gate/lmfdb-robots.txt

    ProxyPreserveHost On
    ProxyPass / http://localhost:8081/
    ProxyPassReverse / http://localhost:8081/

    CustomLog /var/log/apache2/dev-access.log combined
    # Unfiltered diagnostic log: includes local QoS rejections and backend replies.
    CustomLog /var/log/apache2/dev-qos-access.log lmfdb_qos_metrics
    # Legacy proxy-selected log: handler=proxy-server does NOT prove upstream I/O.
    # Local QoS rejections can appear here. Duration is end-to-end, not DB CPU.
    CustomLog /var/log/apache2/dev-backend-access.log "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" vhost=%v host=\"%{Host}i\" handler=%R us=%D" "expr=%{HANDLER} == 'proxy-server'"
    SSLCertificateFile /etc/letsencrypt/live/lmfdb/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lmfdb/privkey.pem

    ## We redirect to gate.html if a cookie is not present in order to protect against bots
    #<IfModule mod_rewrite.c>
    RewriteEngine On

    # Beta is the first HTTPS vhost and receives unmatched Host values.
    # Do not serve LMFDB content under unrelated names (e.g. *.mathseminars.org).
    # This guard is local to beta: other configured sites are not affected.
    # Keep the existing health checks and local server-status handling reachable.
    # No synthetic health response: those requests still use their normal handler.
    RewriteCond %{REQUEST_URI} !^/(alive|statshealth|server-status)$
    RewriteCond %{HTTP_HOST} !(^|\.)lmfdb\.(org|xyz|com)\.?(:[0-9]+)?$ [NC]
    RewriteRule ^ - [R=421,L]
    ErrorDocument 421 "This hostname is not served by the LMFDB backend."

    # Always serve the crawl policy without a cookie, even to blocked bots.
    RewriteRule ^/robots\.txt$ - [L]

    # Never exempt application requests merely because gateorig is present.
    # Skip if alive
    RewriteCond %{REQUEST_URI} !^/alive
    # Skip if alive
    RewriteCond %{REQUEST_URI} !^/statshealth
    # Skip if server-status
    RewriteCond %{REQUEST_URI} !^/server-status
    # Skip if already at /gate.html
    RewriteCond %{REQUEST_URI} !^/gate\.html$
    # Skip if the 'human' cookie is present
    RewriteCond %{HTTP_COOKIE} !(^|;\s*)human=1(;|$)
    RewriteCond %{QUERY_STRING} (.*)
    # Redirect to gate.html, preserving original path in ?gateorig= and the original query string
    RewriteRule ^(.*)$ /gate.html?gateorig=$1&%1 [L,R=302]
    #</IfModule>

</VirtualHost>

